[package]
name = "rattleboard"
description = "A split-flap desktop mirror for your Vestaboard"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "rattleboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rattleboard-core = { path = "../crates/rattleboard-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# In-place updates, when the user asks (see updates.rs)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "net", "rt", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "macos-system-configuration"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Settings → Agents: the paths agent apps keep their config in, and Codex's config.toml
dirs = "6"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "ApplicationModel", "UI_Notifications", "UI_Notifications_Management", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Foundation", "Win32_UI_Shell", "UI_Shell", "Win32_System_Registry"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"

[target."cfg(target_os = \"linux\")".dependencies]
zbus = "5"
libloading = "0.7"
