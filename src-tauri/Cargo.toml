[package]
name = "rattleboard"
version = "0.2.0"
description = "A split-flap desktop mirror for your Vestaboard"
authors = ["Rattleboard contributors"]
license = "MIT"
repository = "https://github.com/slastrina/rattleboard"
edition = "2021"
rust-version = "1.90"

[lib]
name = "rattleboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "net", "rt", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.3"
mdns-sd = { version = "0.21", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
feed-rs = "3"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
sha2 = "0.10"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "ApplicationModel", "UI_Notifications", "UI_Notifications_Management", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_Foundation"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"
