[workspace]
resolver = "2"
members = ["src-tauri", "crates/rattleboard-core", "crates/rattleboard-web"]
default-members = ["src-tauri", "crates/rattleboard-core", "crates/rattleboard-web"]

[workspace.package]
version = "0.6.1"
authors = ["Rattleboard contributors"]
license = "MIT"
repository = "https://github.com/slastrina/rattleboard"
edition = "2021"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
