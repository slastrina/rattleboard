[workspace]
resolver = "2"
members = ["src-tauri", "crates/rattleboard-core", "crates/rattleboard-web"]
default-members = ["src-tauri", "crates/rattleboard-core", "crates/rattleboard-web"]

[workspace.package]
version = "0.10.3"
authors = ["Rattleboard contributors"]
license = "MIT"
repository = "https://github.com/slastrina/rattleboard"
edition = "2021"
rust-version = "1.90"

# QuickJS (script plugins) at full speed in debug builds too, so a script's 250 ms of
# JavaScript means the same in development as in a release.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
