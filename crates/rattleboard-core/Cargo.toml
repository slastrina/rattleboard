[package]
name = "rattleboard-core"
description = "Rattleboard's board engine: the Vestaboard-compatible API server, sequences, transitions and Sources"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["keyring"]
# Secrets in the OS credential store. Without it (Rattleboard Web), secrets go only to the
# file set with `secrets::use_file`.
keyring = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "net", "rt", "process", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "macos-system-configuration"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.3"
mdns-sd = { version = "0.21", default-features = false }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
feed-rs = "3"
ical = { version = "0.11", default-features = false, features = ["ical"] }
rrule = "0.14"
sha2 = "0.10"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
