[package]
name = "rattleboard-web"
description = "Rattleboard Web: a self-hosted split-flap board for any browser"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rattleboard-core = { path = "../rattleboard-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures-util = { version = "0.3", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
