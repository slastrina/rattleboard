name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04-arm: arm64 Linux, as on a Raspberry Pi running 64-bit Raspberry Pi OS.
        os: [macos-latest, windows-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace

  web-image:
    name: Rattleboard Web image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -f crates/rattleboard-web/Dockerfile -t rattleboard-web:ci .
      - name: Smoke test
        run: |
          KEY=$(openssl rand -hex 16)
          docker run -d --name rb -p 7070:7070 -e RATTLEBOARD_KEY="$KEY" rattleboard-web:ci
          for i in $(seq 1 20); do curl -fs localhost:7070/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:7070/local-api/message -d '{"text":"x"}')" = 401
          curl -fs -XPOST localhost:7070/local-api/message -H "X-Vestaboard-Local-Api-Key: $KEY" -d '{"text":"Hello"}'
          curl -fs localhost:7070/rattleboard/info -H "X-Vestaboard-Local-Api-Key: $KEY" | grep -q '"platform":"web"'
          docker rm -f rb
