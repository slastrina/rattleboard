name: Rattleboard Web image

# Push a tag like v0.4.0 to build the Rattleboard Web container for amd64, arm64 and arm/v7
# (32-bit Raspberry Pi OS) and publish it as ghcr.io/slastrina/rattleboard-web:0.4.0 (and
# :0.4, :latest), and as slastrina/rattleboard-web on Docker Hub when the DOCKERHUB_TOKEN
# secret and DOCKERHUB_USERNAME variable are set. DOCKERHUB.md becomes the Docker Hub overview.
# Run it by hand from the Actions tab to build every platform without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/slastrina/rattleboard-web
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/rattleboard-web,enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      # The Dockerfile cross-compiles on the runner for each platform (no emulated compiler);
      # QEMU only runs the final image's tiny steps.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/rattleboard-web/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub only lets a token with the "Read, Write, Delete" scope edit the overview,
      # so a narrower token still publishes the image and just skips this.
      - name: Docker Hub overview
        if: github.ref_type == 'tag' && env.DOCKERHUB_ENABLED == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/rattleboard-web
          short-description: Split-flap message board for any browser, with the Rattleboard API and Sources.
          readme-filepath: DOCKERHUB.md
