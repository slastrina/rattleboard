name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub Release.
# Run it by hand from the Actions tab to get the installers as build artifacts only.
#
# macOS builds are signed with a Developer ID and notarized when these repository
# secrets are set (same names as the other slastrina apps); without them the app is
# only ad-hoc signed:
#   DEVELOPER_ID_CERT_P12 (base64 .p12 holding only the Developer ID Application identity),
#   DEVELOPER_ID_CERT_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)"),
#   APPLE_ID, APPLE_APP_PASSWORD (app-specific password),
#   APPLE_ORG_NAME (not used by Tauri; referenced only so the log masks it),
#   RATTLEBOARD_PROVISION_PROFILE (base64 Developer ID provisioning profile for
#   io.github.slastrina.rattleboard with Communication Notifications, which macOS requires
#   before it shares Focus status; optional: without it the app ships without the entitlement).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ''
            rust-targets: ''
          # 22.04 for the oldest glibc the .deb and AppImage still run on.
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ''
          # Raspberry Pi (64-bit Raspberry Pi OS) and other arm64 Linux, built natively on
          # GitHub's arm64 runner. Bundles are named _arm64.deb and _aarch64.AppImage, so
          # they sit beside the x86_64 ones in the release without colliding.
          - name: Linux arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,appimage
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf

      # Tauri treats an empty APPLE_* variable as "sign with this", so only export the
      # ones whose secrets are actually set.
      - name: Signing setup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.RATTLEBOARD_PROVISION_PROFILE }}
          # Not secret: the team ID is embedded in every app it signs.
          APPLE_TEAM_ID: LN23P43535
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Developer ID secrets not set; the macOS build will be ad-hoc signed and not notarized."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && { echo "$v<<__RB_EOF__"; echo "${!v}"; echo "__RB_EOF__"; } >> "$GITHUB_ENV"
          done
          echo "Signing with the Developer ID identity."
          # The Focus entitlement needs its provisioning profile inside the app, or the app
          # won't launch; so both go in only together, and only in this signed build.
          if [ -n "$PROVISION_PROFILE" ]; then
            echo "$PROVISION_PROFILE" | base64 --decode > src-tauri/macos/embedded.provisionprofile
            echo "RB_MAC_ARGS=--config src-tauri/tauri.macos-release.conf.json" >> "$GITHUB_ENV"
            echo "Embedding the provisioning profile and the Focus entitlement."
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ORG_NAME: ${{ secrets.APPLE_ORG_NAME }}
        with:
          args: ${{ matrix.args }} ${{ env.RB_MAC_ARGS }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Rattleboard ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            **macOS 11+ (Apple Silicon and Intel):** open the `.dmg` and drag Rattleboard to Applications. It's signed and notarized by Apple. Or install with Homebrew: `brew tap slastrina/tap`, `brew trust --tap slastrina/tap`, then `brew install --cask rattleboard`
            **Windows:** run the `-setup.exe` (or the `.msi`). If SmartScreen warns you, choose **More info → Run anyway**.
            **Linux (x86_64):** install the `_amd64.deb` (Debian, Ubuntu 22.04+) or run the `_amd64.AppImage` (`chmod +x` first). The tray needs libayatana-appindicator (and on GNOME the AppIndicator extension); keys need a Secret Service keyring such as GNOME Keyring or KWallet.
            **Raspberry Pi and other arm64 Linux:** on 64-bit Raspberry Pi OS (Bookworm) with the desktop, `sudo apt install ./Rattleboard_*_arm64.deb`, or run the `_aarch64.AppImage`. See "Raspberry Pi" in the README.
            **Rattleboard Web (Docker):** `docker run -p 7070:7070 -v rattleboard:/data slastrina/rattleboard-web`
          releaseDraft: false
          prerelease: false

      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: rattleboard-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Bumps the cask in slastrina/homebrew-tap once the release has its DMG.
  # Needs a HOMEBREW_TAP_PAT secret with write access to that repo; skipped without it.
  homebrew:
    name: Update Homebrew tap
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cask
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_PAT" ]; then
            echo "::warning::HOMEBREW_TAP_PAT not set; skipping the tap update."; exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Rattleboard_${VERSION}_universal.dmg"
          gh release download "$TAG" --pattern "$DMG" --dir "$RUNNER_TEMP"
          SHA=$(sha256sum "$RUNNER_TEMP/$DMG" | awk '{print $1}')
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/slastrina/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA}/" packaging/homebrew/rattleboard.rb.template > "$TAP_DIR/Casks/rattleboard.rb"
          cd "$TAP_DIR"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/rattleboard.rb
          git commit -m "rattleboard ${VERSION}" || { echo "cask unchanged"; exit 0; }
          git push origin HEAD
