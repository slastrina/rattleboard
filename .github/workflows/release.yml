name: Release

# Push a tag like v0.1.0 to build installers and publish a GitHub Release.
# Run it by hand from the Actions tab to get the installers as build artifacts only.
#
# macOS builds are signed with a Developer ID and notarized when these repository
# secrets are set (same names as the other slastrina apps); without them the app is
# only ad-hoc signed:
#   DEVELOPER_ID_CERT_P12 (base64 .p12 holding only the Developer ID Application identity),
#   DEVELOPER_ID_CERT_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: … (TEAMID)"),
#   APPLE_ID, APPLE_APP_PASSWORD (app-specific password), APPLE_TEAM_ID,
#   APPLE_ORG_NAME (not used by Tauri; referenced only so the log masks it).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri treats an empty APPLE_* variable as "sign with this", so only export the
      # ones whose secrets are actually set.
      - name: Signing setup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Developer ID secrets not set; the macOS build will be ad-hoc signed and not notarized."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && { echo "$v<<__RB_EOF__"; echo "${!v}"; echo "__RB_EOF__"; } >> "$GITHUB_ENV"
          done
          echo "Signing with the Developer ID identity."

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ORG_NAME: ${{ secrets.APPLE_ORG_NAME }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Rattleboard ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            **macOS 11+ (Apple Silicon and Intel):** open the `.dmg` and drag Rattleboard to Applications. It's signed with a Developer ID and notarized by Apple.
            **Windows:** run the `-setup.exe` (or the `.msi`). If SmartScreen warns you, choose **More info → Run anyway**.
          releaseDraft: false
          prerelease: false

      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: rattleboard-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
