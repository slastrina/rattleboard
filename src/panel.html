<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rattleboard</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  html { height: 100%; }
  body { min-height: 100%; overflow-y: auto; }
  body { color: #1b1b1d; font-size: 13px; }
  .mac body { background: #ececec; }
  .win body { background: #f3f3f3; }
  .seg { display: inline-flex; justify-self: start; padding: 2px; border-radius: 7px; background: rgba(0,0,0,.07); gap: 2px; }
  .seg button { border: none; font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 5px; cursor: pointer; background: transparent; color: #4a4b50; }
  .seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.08); }
  .seg.tabs button { padding: 4px 16px; }
  .seg.poll button { padding: 4px 10px; }
  .grid { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 16px; align-items: center; }
  .lbl { color: #3b3c40; }
  .hint { color: #6b6d72; font-size: 12px; }
  .tog { width: 38px; height: 22px; border-radius: 11px; position: relative; cursor: pointer; transition: background .15s; flex: none; background: rgba(0,0,0,.18); }
  .tog.on { background: oklch(0.58 0.17 255); }
  .tog > div { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .tog.on > div { left: 18px; }
  .field { height: 26px; box-sizing: border-box; border: 1px solid rgba(0,0,0,.18); border-radius: 6px; padding: 0 8px; font: inherit; font-size: 13px; background: #fff; }
  .btn { border: 1px solid rgba(0,0,0,.15); background: #fff; border-radius: 6px; font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .primary { border: none; background: oklch(0.58 0.17 255); color: #fff; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 16px; cursor: pointer; }
  input[type=range] { width: 220px; accent-color: oklch(0.58 0.17 255); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .corner { position: absolute; width: 40px; height: 18px; border-radius: 3px; background: rgba(255,255,255,.28); cursor: pointer; }
  .corner.on { background: oklch(0.58 0.17 255); box-shadow: 0 0 0 2px #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script src="shared/common.js"></script>
<script src="panel.js"></script>
</body>
</html>
